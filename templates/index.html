<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Movie Prediction App</title>
</head>
<body>
    <h1>Movie Prediction App</h1>
    <form action="/predict" method="post">
        <label for="budget">Budget (in million $):</label>
        <input type="number" id="budget" name="budget" step="0.01" required
               value="{{ features.budget if features else '' }}" />
        <br /><br />
        <label for="genre">Genre:</label>
        <select id="genre" name="genre" required>
            <option value="">Select Genre</option>
            <option value="Action" {% if features and features.genre == 'Action' %}selected{% endif %}>Action</option>
            <option value="Comedy" {% if features and features.genre == 'Comedy' %}selected{% endif %}>Comedy</option>
            <option value="Drama" {% if features and features.genre == 'Drama' %}selected{% endif %}>Drama</option>
            <option value="Horror" {% if features and features.genre == 'Horror' %}selected{% endif %}>Horror</option>
            <option value="Romance" {% if features and features.genre == 'Romance' %}selected{% endif %}>Romance</option>
        </select>
        <br /><br />
        <button type="submit">Predict</button>
    </form>

    {% if prediction %}
    <h2>Prediction Result:</h2>
    <p>{{ prediction }}</p>
    {% endif %}
</body>
</html>
